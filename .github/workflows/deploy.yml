name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static pages
        run: python3 scripts/build.py
      - name: Check release
        run: |
          python3 scripts/check.py
          node --check assets/js/main.js
      - name: Install CI browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-save playwright@1.58.2
          "$RUNNER_TEMP/browser-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check responsive pages and enquiry controls
        env:
          NODE_PATH: ${{ runner.temp }}/browser-qa/node_modules
        run: node scripts/browser-qa.cjs
      - name: Save browser review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: qa-output/
          retention-days: 7
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
